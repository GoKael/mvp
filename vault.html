<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault — Lexa Language Reactor</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Additional inline styles for Vault specific components if not in styles.css */
    #main-container {
      margin-top: 80px;
      padding: 0 40px;
      transition: margin-right 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #vault-header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
    }

    #vault-blocks-container {
      width: 100%;
      max-width: 1200px;
    }

    .level-sidebar {
      position: fixed;
      right: 20px;
      top: 100px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 100;
    }

    .level-btn {
      width: 40px;
      height: 30px;
      background: #1e222d;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: #94a3b8;
      cursor: pointer;
      transition: 0.2s;
    }

    .level-btn:hover, .level-btn.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    /* Dictionary Sidebar (Original Style) */
    #dict-sidebar {
      position: fixed;
      right: 0;
      top: 64px;
      width: 400px;
      height: calc(100vh - 64px);
      background: #111;
      border-left: 1px solid #333;
      display: none; /* Controlled by JS */
      flex-direction: column;
      padding: 30px;
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      z-index: 1001;
      overflow-y: auto;
    }

    #dict-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 25px;
    }

    #dict-word {
      font-size: 36px;
      font-weight: 900;
      color: var(--accent-gold);
      font-family: var(--font-display);
      margin: 0;
    }

    .dict-meta {
      display: flex;
      gap: 15px;
      font-size: 12px;
      font-weight: bold;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .dict-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }

    .dict-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #eee;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .dict-btn:hover { background: #333; }
    #dict-known-btn:hover { border-color: #4caf50; color: #4caf50; }
    #dict-learn-btn:hover { border-color: #ff9800; color: #ff9800; }
    #dict-ignore-btn:hover { border-color: #f44336; color: #f44336; }

    .lexa-tabs {
      display: flex;
      border-bottom: 1px solid #333;
      margin-bottom: 20px;
    }
    .lexa-tab {
      padding: 10px 15px;
      font-size: 12px;
      font-weight: bold;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      text-transform: uppercase;
    }
    .lexa-tab.active {
      color: #a78bfa;
      border-bottom-color: #a78bfa;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    
    #dict-examples {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #vault-range-select {
      background: #1e222d;
      color: #fff;
      border: 1px solid #333;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
  </style>
</head>
<body>
  <nav>
    <a href="vault.html" class="active">VAULT</a>
    <a href="memory.html">PRACTICE</a>
  </nav>

  <div id="main-container">
    <div id="vault-header">
      <div>
        <h1 style="margin:0; font-size:32px; font-weight:900;">Word Bank</h1>
        <p style="color:var(--text-muted); margin:5px 0 0 0;">Master the top 8,000 words in Vietnamese.</p>
      </div>
      <div style="display:flex; align-items:center; gap:20px;">
        <div style="text-align:right;">
          <div style="font-size:10px; color:#666; font-weight:bold; text-transform:uppercase;">Vocabulary Range</div>
          <select id="vault-range-select">
            <option value="1000">Rank 1 - 1000</option>
            <option value="2000">Rank 1 - 2000</option>
            <option value="4000">Rank 1 - 4000</option>
            <option value="6000">Rank 1 - 6000</option>
            <option value="8000" selected>All 8000 Words</option>
          </select>
        </div>
        <div style="display:flex; gap:15px; background:rgba(255,255,255,0.03); padding:10px 20px; border-radius:12px; border:1px solid rgba(255,255,255,0.05);">
          <div style="text-align:center;"><div id="count-known" style="font-weight:900; color:#4ade80;">0</div><div style="font-size:9px; color:#666;">KNOWN</div></div>
          <div style="text-align:center;"><div id="count-learn" style="font-weight:900; color:#fb923c;">0</div><div style="font-size:9px; color:#666;">LEARN</div></div>
          <div style="text-align:center;"><div id="count-suggest" style="font-weight:900; color:#94a3b8;">0</div><div style="font-size:9px; color:#666;">BASE</div></div>
        </div>
      </div>
    </div>

    <div id="vault-blocks-container">
      <!-- Injected by vault.js -->
    </div>
  </div>

  <div class="level-sidebar" id="level-sidebar">
    <!-- Injected by vault.js -->
  </div>

  <div id="dict-sidebar">
    <div id="dict-header">
      <div>
        <h2 id="dict-word">Word</h2>
        <div id="dict-hv" style="color:#888; font-size:14px; margin-top:5px;">Hán-Việt: ...</div>
      </div>
      <button id="dict-audio-btn" class="glass" style="width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg viewBox="0 0 24 24" style="width:20px; fill:#fff;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
    </div>

    <div class="dict-meta">
      <span id="dict-type">NOUN</span>
      <span id="dict-rank">#123</span>
    </div>

    <div class="dict-controls">
      <button class="dict-btn" id="dict-known-btn"><span>✅</span><span>KNOWN</span></button>
      <button class="dict-btn" id="dict-learn-btn"><span>📖</span><span>LEARN</span></button>
      <button class="dict-btn" id="dict-ignore-btn"><span>⛔</span><span>IGNORE</span></button>
    </div>

    <div class="lexa-tabs">
      <div class="lexa-tab active" data-tab="explain">Explain</div>
      <div class="lexa-tab" data-tab="examples">Examples</div>
      <div class="lexa-tab" data-tab="grammar">Grammar</div>
    </div>

    <div id="tab-explain" class="tab-pane active" style="font-size:14px; color:#ccc; line-height:1.6;">
      <!-- Content -->
    </div>

    <div id="tab-examples" class="tab-pane" style="display:none; flex-direction:column; gap:12px;">
      <div id="dict-examples"></div>
    </div>

    <div id="tab-grammar" class="tab-pane" style="font-size:14px; color:#ccc; line-height:1.6;">
      <!-- Content -->
    </div>

    <div style="margin-top:auto; padding-top:40px;">
       <button id="close-sidebar-btn" style="background:none; border:none; color:#444; font-size:11px; font-weight:bold; cursor:pointer; text-transform:uppercase; transition:0.2s;" onmouseenter="this.style.color='#888'" onmouseleave="this.style.color='#444'">Close Sidebar</button>
    </div>
  </div>

  <script src="vault.js"></script>
</body>
</html>
