<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vault — Bento Language Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-deep: #020617;
      --accent: #0EA5E9;
      --glass: rgba(15, 23, 42, 0.8);
    }
    body {
      background-color: var(--bg-deep);
      color: #E2E8F0;
      font-family: 'Inter', sans-serif;
    }
    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 1rem;
    }
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      grid-auto-rows: 100px;
      gap: 1rem;
    }
    .bento-item {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bento-item:hover {
      transform: scale(1.02);
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.1);
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="overflow-hidden h-screen flex flex-col">
  <!-- Top Nav -->
  <nav class="h-16 border-b border-slate-800 flex items-center justify-between px-8 bg-slate-900/50 backdrop-blur-md z-50">
    <div class="flex items-center gap-8">
      <div class="text-xl font-black tracking-tighter text-sky-400">Bento<span class="text-slate-100 italic">Core</span></div>
      <div class="flex gap-6 text-sm font-medium">
        <a href="vault.html" class="text-sky-400 border-b-2 border-sky-400 pb-5 pt-5">VAULT</a>
        <a href="memory.html" class="text-slate-400 hover:text-white transition-colors pb-5 pt-5">PRACTICE</a>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="relative">
        <input type="text" id="vault-search" placeholder="Quick search..." class="bg-slate-800/50 border border-slate-700 rounded-full py-1.5 px-4 pl-10 text-sm focus:outline-none focus:border-sky-500 transition-all w-64">
        <svg class="w-4 h-4 absolute left-3.5 top-2.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <button id="reset-vault-btn" class="text-xs text-slate-500 hover:text-red-400 border border-slate-800 px-3 py-1.5 rounded-md transition-all">RESET DATA</button>
    </div>
  </nav>

  <main class="flex-1 flex overflow-hidden">
    <!-- Left Statistics (Bento Style) -->
    <aside class="w-80 p-6 flex flex-col gap-4 border-r border-slate-800 bg-slate-900/20 scrollbar-hide overflow-y-auto">
      <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest pl-2 mb-2">Metrics</h2>
      
      <div class="glass-card p-5 flex flex-col gap-1 items-center justify-center">
        <div class="text-3xl font-black text-sky-400" id="stat-known">0</div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Words Known</div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="glass-card p-4 flex flex-col items-center">
           <div class="text-xl font-bold text-orange-400" id="stat-learning">0</div>
           <div class="text-[9px] text-slate-500 font-bold uppercase">Learning</div>
        </div>
        <div class="glass-card p-4 flex flex-col items-center">
           <div class="text-xl font-bold text-slate-400" id="stat-suggested">0</div>
           <div class="text-[9px] text-slate-500 font-bold uppercase">Base</div>
        </div>
      </div>

      <div class="glass-card p-6 flex-1 flex flex-col overflow-hidden">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Frequency Map</h3>
        <div class="flex-1 overflow-y-auto pr-2 scrollbar-hide flex flex-col gap-2" id="level-anchors">
           <!-- Anchors 1-8k -->
        </div>
      </div>
    </aside>

    <!-- Main Grid Content -->
    <section class="flex-1 p-8 overflow-y-auto scroll-smooth relative" id="vault-scroll-container">
      <div class="mb-8 flex justify-between items-end">
        <div>
          <h1 class="text-2xl font-bold tracking-tight">Active Vocabulary</h1>
          <p class="text-slate-500 text-sm">Master your dictionary rank by rank.</p>
        </div>
        <div class="flex gap-2">
           <select id="rank-select" class="bg-slate-800 text-xs border border-slate-700 rounded-md px-2 py-1 focus:outline-none">
             <option value="1000">Rank 1 - 1000</option>
             <option value="2000">Rank 1 - 2000</option>
             <option value="8000">All 8000 Words</option>
           </select>
        </div>
      </div>

      <!-- Word Bento Grid -->
      <div class="bento-grid" id="word-grid">
        <!-- Words injected here -->
      </div>
      
      <!-- Loader -->
      <div id="grid-loader" class="py-20 flex justify-center hidden">
        <div class="w-8 h-8 border-4 border-sky-400 border-t-transparent rounded-full animate-spin"></div>
      </div>
    section>

    <!-- Right Drawer (Modern Expandable Panel) -->
    <div id="word-drawer" class="fixed top-16 right-0 w-[450px] h-[calc(100vh-64px)] bg-slate-900 border-l border-slate-800 transform translate-x-full transition-transform duration-300 ease-out z-[60] shadow-2xl flex flex-col">
       <button id="close-drawer" class="absolute top-4 left-4 text-slate-500 hover:text-white">&times; Close</button>
       <div class="p-8 pt-12 flex flex-col flex-1 overflow-y-auto">
          <div class="mb-8">
            <div id="drawer-word" class="text-5xl font-black tracking-tighter mb-2">Word</div>
            <div id="drawer-rank" class="text-xs font-bold text-sky-500 uppercase tracking-widest">Rank #001</div>
          </div>

          <div class="flex gap-3 mb-8">
            <button data-status="2" class="status-action-btn flex-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 py-3 rounded-xl font-bold text-sm hover:bg-emerald-500/20 transition-all">KNOWN</button>
            <button data-status="1" class="status-action-btn flex-1 bg-orange-500/10 text-orange-400 border border-orange-500/20 py-3 rounded-xl font-bold text-sm hover:bg-orange-500/20 transition-all">LEARN</button>
          </div>

          <div class="space-y-6">
            <div class="glass-card p-6 bg-slate-900/50">
              <div class="text-xs text-slate-500 uppercase font-bold mb-2">Primary Meaning</div>
              <p id="drawer-trans" class="text-xl text-slate-100 font-medium leading-relaxed">...</p>
            </div>

            <div>
              <div class="text-xs text-slate-500 uppercase font-bold mb-4">Context Examples</div>
              <div id="drawer-examples" class="space-y-3">
                <!-- Examples injected here -->
              </div>
            </div>
          </div>
       </div>
    </div>
  </main>

  <script type="module" src="vault-new.js"></script>
</body>
</html>
