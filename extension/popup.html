<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
    }
    .card {
      background: #1e1e1e;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      border-left: 4px solid #BB86FC;
    }
    .title { font-size: 12px; color: #888; margin-bottom: 5px; }
    .content { font-size: 14px; font-weight: bold; line-height: 1.4; }
    button {
      width: 100%;
      background-color: #BB86FC;
      color: black;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #9965f4; }
    .status { font-size: 10px; text-align: center; margin-top: 5px; color: #4CAF50; }
  </style>
</head>
<body>
  <h3>🔥 Trilingual MVP</h3>
  <div class="card">
    <div class="title" id="video-title">No video detected</div>
    <div class="content" id="subtitle-text">Waiting for subtitles...</div>
  </div>
  <button id="save-btn">SAVE WORD</button>
  <div class="status" id="status-msg"></div>
  <script src="popup.js"></script>
</body>
</html>
