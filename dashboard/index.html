<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Graph | Knowledge Exploration</title>
  <script defer src="../lib/force-graph.min.js"></script>
  <script defer src="link.js"></script>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { background-color: var(--bg-dark); overflow: hidden; }
    #header { position: absolute; top: 80px; left: 20px; z-index: 10; pointer-events: none; }
    #header h1 { color: var(--accent-gold); margin: 0; }
    #header p { color: var(--text-muted); margin: 5px 0; }
  </style>
</head>
<body>
  <nav>
    <a href="../vault.html">VAULT</a>
    <a href="index.html" class="active">LINK</a>
    <a href="../memory.html">MEMORY</a>
  </nav>

  <div id="header">
    <h1>Knowledge Link</h1>
    <p>Visualizing your trilingual cognitive map</p>
  </div>
  
  <div id="graph" style="width: 100vw; height: 100vh;"></div>

  <!-- Inlined Shared Sidebar (LR Style) -->
  <div id="dict-sidebar" class="glass" style="display:none; position:fixed; top:60px; right:0; width:350px; height:calc(100vh - 60px); padding:20px; display:flex; flex-direction:column; z-index:1000; overflow-y:auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <h1 id="dict-word" style="margin:0; color:var(--accent-gold); font-size:32px;">Word</h1>
      <button id="dict-audio-btn" class="btn-audio" style="background:none; border:none; cursor:pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--accent-gold)"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
    </div>
    <div id="dict-meta" style="font-size:12px; opacity:0.6; margin-bottom:20px;">
      <span id="dict-type">Type</span> • <span id="dict-rank">#000</span>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:25px;">
      <button id="study-this-btn" class="btn-primary" style="flex:1; background:var(--accent-gold); color:black;">🎯 Study this</button>
    </div>
    <p id="dict-hv" style="color:var(--text-muted); font-size:14px; margin-bottom:10px;">Hán-Việt: ...</p>
    <div id="dict-trans" style="font-size:18px; line-height:1.4; margin-bottom:30px;">Meaning goes here.</div>
    <h3 style="font-size:14px; text-transform:uppercase; color:var(--text-muted); margin-bottom:15px;">Examples</h3>
    <div id="dict-examples" style="display:flex; flex-direction:column; gap:12px;"></div>
  </div>

</body>
</html>
