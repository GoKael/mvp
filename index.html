<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b34b2f">
  <meta name="description" content="Lexa 用 30 秒三句情境與 Core 100，陪台灣學習者開口說越南語。">
  <title>Lexa｜30 秒學三句越南語</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=17">
</head>
<body>
  <a class="skip-link" href="#app">跳到主要內容</a>

  <header class="site-header">
    <a class="brand" href="#/today" aria-label="Lexa 首頁">
      <span class="brand-mark">L</span>
      <span><b>Lexa</b><small>Vietnamese field notes</small></span>
    </a>

    <nav class="desktop-nav" aria-label="主要導覽">
      <a href="#/today" data-route="today">今天</a>
      <a href="#/lessons" data-route="lessons">情境課</a>
      <a href="#/words" data-route="words">Core 100</a>
      <a href="#/review" data-route="review">複習 <span id="nav-due">0</span></a>
      <a href="#/patterns" data-route="patterns">句型</a>
    </nav>

    <div class="header-tools">
      <span id="audio-status" aria-live="polite">語音就緒</span>
      <label class="rate-control">速度
        <select id="playback-rate" aria-label="播放速度">
          <option value="0.8">0.8×</option>
          <option value="1">1×</option>
          <option value="1.15">1.15×</option>
        </select>
      </label>
      <strong id="header-progress">0 / 100 已會</strong>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <section class="loading-state">
      <span></span>
      <p>正在整理今天的三句話…</p>
    </section>
  </main>

  <nav class="mobile-nav" aria-label="行動版導覽">
    <a href="#/today" data-route="today"><span>◌</span>今天</a>
    <a href="#/lessons" data-route="lessons"><span>▤</span>情境課</a>
    <a href="#/words" data-route="words"><span>Aa</span>單字</a>
    <a href="#/review" data-route="review"><span>↻</span>複習</a>
    <a href="#/patterns" data-route="patterns"><span>⌘</span>句型</a>
  </nav>

  <dialog id="word-dialog" class="word-dialog">
    <button class="dialog-close" type="button" data-close-dialog aria-label="關閉">×</button>
    <div data-dialog-content></div>
  </dialog>

  <aside id="lexeme-popover" class="lexeme-popover" role="dialog" aria-label="單字快速操作" hidden>
    <div data-lexeme-content></div>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Lexa 需要 JavaScript 才能保存進度與播放課程。</noscript>
  <script type="module" src="app.js?v=22"></script>
</body>
</html>
