<!-- components/sidebar.html -->
<div id="dict-sidebar" class="glass" style="display:none; position:fixed; top:80px; right:20px; width:320px; height:calc(100% - 120px); padding:20px; display:flex; flex-direction:column; z-index:1000;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 id="dict-word" style="margin:0; color:var(--accent);">Word</h2>
    <span id="dict-type" style="font-size:12px; opacity:0.6;">Noun</span>
  </div>
  <p id="dict-hv" style="color:var(--text-dim);">Hán-Việt: ...</p>
  <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); width:100%; margin:15px 0;">
  <p id="dict-trans" style="font-size:18px;">Meaning goes here.</p>
  
  <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
    <button class="btn-primary" onclick="speak(document.getElementById('dict-word').innerText)">🔊 Play Vietnamese Audio</button>
    <button class="btn-primary" style="background:rgba(255,255,255,0.1); color:white;" onclick="jumpToLink()">🔗 View in Link Graph</button>
  </div>
</div>

<script>
function showSidebar(data) {
  const sidebar = document.getElementById('dict-sidebar');
  sidebar.style.display = 'flex';
  document.getElementById('dict-word').innerText = data.word || data.id;
  document.getElementById('dict-hv').innerText = `Hán-Việt: ${data.hv || data.hanViet || '???'}`;
  document.getElementById('dict-trans').innerText = data.trans || 'Translation loading...';
  document.getElementById('dict-type').innerText = data.type || 'Word';
}

function jumpToLink() {
  window.location.href = '/mvp/dashboard/index.html';
}

function speak(text) {
  const msg = new SpeechSynthesisUtterance();
  msg.text = text;
  msg.rate = 0.9;
  
  // Force Vietnamese Voice
  const voices = window.speechSynthesis.getVoices();
  const viVoice = voices.find(v => v.lang.includes('vi') || v.name.includes('Vietnamese'));
  if (viVoice) msg.voice = viVoice;
  msg.lang = 'vi-VN';
  
  window.speechSynthesis.speak(msg);
}

// Ensure voices are loaded
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = () => {};
}
</script>
