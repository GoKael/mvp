<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhrasePump — Lexa Language Reactor</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Additional inline styles for Practice Module */
    #main-container {
      margin-top: 80px;
      padding: 0 40px;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 1200px;
      margin-left: auto;
      margin-right: auto;
    }

    #setup-screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    #gh-heatmap {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
    }

    .config-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .level-chip {
      padding: 8px 16px;
      background: #333;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .level-chip.active {
      background: rgba(255, 152, 0, 0.2);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }

    /* Practice Screen */
    #practice-screen {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      padding-top: 60px;
    }

    #sentence-area {
      min-height: 200px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 42px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      max-width: 900px;
    }

    .word-token {
      transition: all 0.2s;
      padding: 2px 5px;
      border-radius: 6px;
    }
    .word-token:hover { background: rgba(255, 255, 255, 0.1); }
    .word-token.focal { text-decoration: underline; text-underline-offset: 8px; }

    .control-btns {
      display: flex;
      gap: 20px;
      margin-top: 40px;
    }

    .btn-action {
      width: 140px;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #1e1e1e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: 0.2s;
    }

    .btn-action span:first-child { font-size: 24px; }
    .btn-action span:last-child { font-size: 10px; opacity: 0.6; letter-spacing: 1px; }

    #btn-known:hover { background: #4caf50; color: black; border-color: #4caf50; }
    #btn-learn:hover { background: #ff9800; color: black; border-color: #ff9800; }
    #btn-ignore:hover { background: #444; }

    /* Progress bar */
    .progress-wrapper {
      width: 100%;
      max-width: 600px;
      height: 4px;
      background: #333;
      border-radius: 2px;
      margin-top: 20px;
      position: relative;
    }
    #status-fill {
      height: 100%;
      background: var(--accent-gold);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Popover */
    #hover-popover {
      position: fixed;
      display: none;
      background: #1e1e1e;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 10000;
      transform: translateX(-50%);
    }

    /* Dictionary Sidebar (Same as Vault) */
    #dict-sidebar {
      position: fixed;
      right: 0;
      top: 64px;
      width: 400px;
      height: calc(100vh - 64px);
      background: #111;
      border-left: 1px solid #333;
      display: none;
      flex-direction: column;
      padding: 30px;
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      z-index: 1001;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <nav>
    <a href="vault.html">VAULT</a>
    <a href="memory.html" class="active">PRACTICE</a>
  </nav>

  <div id="main-container">
    <div id="setup-screen">
      <div class="dashboard-header">
        <div>
          <h1 style="margin:0; font-size:32px; font-weight:900;">PhrasePump</h1>
          <p style="color:var(--text-muted); margin:5px 0 0 0;">Interactive recall practice for Vietnamese.</p>
        </div>
        <div style="background:rgba(255,152,0,0.1); padding:10px 20px; border-radius:12px; border:1px solid rgba(255,152,0,0.2); display:flex; align-items:center; gap:10px;">
          <span id="today-emoji" style="font-size:24px;">💪</span>
          <div>
            <div id="today-practice-val" style="font-weight:900; color:var(--accent-gold); font-size:20px;">0</div>
            <div style="font-size:9px; color:#888; font-weight:bold;">WORDS TODAY</div>
          </div>
        </div>
      </div>

      <div id="gh-heatmap"></div>

      <div class="config-card">
        <h3 style="margin:0; font-size:14px; text-transform:uppercase; color:#666; letter-spacing:1px;">Session Settings</h3>
        
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:14px; font-weight:bold;">Vocabulary Level</span>
          <div style="display:flex; gap:8px;">
            <div class="level-chip" data-level="1000">1K</div>
            <div class="level-chip" data-level="2000">2K</div>
            <div class="level-chip" data-level="5000">5K</div>
            <div class="level-chip active" data-level="8000">ALL</div>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:14px; font-weight:bold;">Items per Session</div>
            <div style="font-size:11px; color:#555;">How many sentences to practice now.</div>
          </div>
          <div style="display:flex; align-items:center; gap:15px; width:200px;">
            <input type="range" id="session-slider" min="5" max="50" value="10" step="5" style="flex:1; accent-color:var(--accent-gold);">
            <span id="session-size-val" style="font-weight:900; color:var(--accent-gold); width:20px;">10</span>
          </div>
        </div>

        <div style="display:flex; gap:10px; margin-top:10px;">
          <button id="start-practice-btn" class="btn-primary" style="flex:2; padding:18px;">START PRACTICE</button>
          <button id="reset-settings-btn" style="flex:1; background:none; border:1px solid #333; border-radius:10px; color:#555; font-size:11px; font-weight:bold; cursor:pointer;">RESET ALL</button>
        </div>
      </div>
    </div>

    <div id="practice-screen">
      <div style="text-align:center;">
         <div id="focal-word-hint" style="font-size:12px; font-weight:bold; color:var(--accent-gold); text-transform:uppercase; letter-spacing:4px; margin-bottom:10px;">Target</div>
         <div id="sentence-area">Loading sentence...</div>
      </div>

      <div class="control-btns">
        <button id="btn-known" class="btn-action"><span>✅</span><span>KNOWN (Z)</span></button>
        <button id="btn-learn" class="btn-action"><span>📖</span><span>LEARN (X)</span></button>
        <button id="btn-ignore" class="btn-action"><span>⛔</span><span>IGNORE (C)</span></button>
      </div>

      <div style="width:100%; max-width:600px;">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:#555; margin-bottom:8px; font-weight:bold;">
          <span>PROGRESS</span>
          <span id="progress-counter">0 / 10</span>
        </div>
        <div class="progress-wrapper">
          <div id="status-fill"></div>
        </div>
      </div>

      <button onclick="location.reload()" style="background:none; border:none; color:#333; font-size:11px; font-weight:bold; cursor:pointer; text-transform:uppercase; margin-top:40px;">End Practice</button>
    </div>
  </div>

  <div id="hover-popover"></div>

  <!-- Reusing Lexa Sidebar logic from vault -->
  <div id="dict-sidebar" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:25px;">
      <div>
        <h2 id="dict-word" style="font-size:36px; font-weight:900; color:var(--accent-gold); margin:0;">Word</h2>
        <div id="dict-hv" style="color:#888; font-size:14px; margin-top:5px;">Hán-Việt: ...</div>
      </div>
      <button id="dict-audio-btn" style="width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.05); border:1px solid #333; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <svg viewBox="0 0 24 24" style="width:20px; fill:#fff;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      </button>
    </div>
    
    <div style="display:flex; gap:15px; font-size:12px; font-weight:bold; color:#666; text-transform:uppercase; margin-bottom:20px;">
      <span id="dict-type">NOUN</span>
      <span id="dict-rank">#123</span>
    </div>

    <div style="display:flex; gap:8px; margin-bottom:30px;">
      <button class="dict-btn" id="dict-known-btn" style="flex:1; padding:10px; background:#222; border:1px solid #333; border-radius:8px; color:#eee; font-size:11px; font-weight:bold; cursor:pointer;">KNOWN</button>
      <button class="dict-btn" id="dict-learn-btn" style="flex:1; padding:10px; background:#222; border:1px solid #333; border-radius:8px; color:#eee; font-size:11px; font-weight:bold; cursor:pointer;">LEARN</button>
      <button class="dict-btn" id="dict-ignore-btn" style="flex:1; padding:10px; background:#222; border:1px solid #333; border-radius:8px; color:#eee; font-size:11px; font-weight:bold; cursor:pointer;">IGNORE</button>
    </div>

    <div class="lexa-tabs" style="display:flex; border-bottom:1px solid #333; margin-bottom:20px;">
      <div class="lexa-tab active" data-tab="explain" style="padding:10px 15px; font-size:12px; font-weight:bold; color:#a78bfa; border-bottom:2px solid #a78bfa; cursor:pointer; text-transform:uppercase;">Explain</div>
      <div class="lexa-tab" data-tab="examples" style="padding:10px 15px; font-size:12px; font-weight:bold; color:#666; cursor:pointer; text-transform:uppercase;">Examples</div>
      <div class="lexa-tab" data-tab="grammar" style="padding:10px 15px; font-size:12px; font-weight:bold; color:#666; cursor:pointer; text-transform:uppercase;">Grammar</div>
    </div>

    <div id="tab-explain" style="font-size:14px; color:#ccc; line-height:1.6;"></div>
    <div id="tab-examples" style="display:none; flex-direction:column; gap:12px;"><div id="dict-examples"></div></div>
    <div id="tab-grammar" style="display:none; font-size:14px; color:#ccc; line-height:1.6;"></div>

    <div style="margin-top:auto; padding-top:40px;">
       <button id="close-sidebar-btn" style="background:none; border:none; color:#444; font-size:11px; font-weight:bold; cursor:pointer; text-transform:uppercase;">Close Sidebar</button>
    </div>
  </div>

  <script src="memory.js"></script>
</body>
</html>
