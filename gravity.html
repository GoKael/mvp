<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lexa 拼字實驗</title>
  <style>
    :root { color-scheme: light; --paper:#f2eadb; --card:#fffdf7; --ink:#302a23; --muted:#74695d; --rust:#b34b2f; --amber:#e6a632; --line:#d9ccbb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 80% 15%, rgba(230,166,50,.2), transparent 28%), var(--paper); color: var(--ink); font-family: "Avenir Next", "PingFang TC", sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; max-width: 920px; margin: 0 auto; padding: 24px; }
    header a { color: var(--rust); font-weight: 800; text-decoration: none; }
    main { display: grid; width: min(760px, calc(100% - 28px)); min-height: 650px; margin: 30px auto; place-items: center; padding: clamp(28px, 6vw, 70px); border: 1px solid var(--line); border-radius: 42px 14px 42px 14px; background: var(--card); box-shadow: 0 35px 80px rgba(72,51,31,.12); text-align: center; }
    .eyebrow { color: var(--rust); font-size: 11px; font-weight: 900; letter-spacing: .18em; }
    h1 { margin: 14px 0 5px; font-family: Georgia, "Noto Serif TC", serif; font-size: clamp(48px, 10vw, 88px); font-weight: 500; }
    #meaning { color: var(--muted); font-size: 19px; }
    #answer { display: flex; min-height: 75px; align-items: end; justify-content: center; gap: 8px; margin: 50px 0 24px; }
    #answer span { display: grid; min-width: 50px; height: 66px; place-items: center; border-bottom: 3px solid var(--amber); font-size: 34px; font-weight: 800; }
    #tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-height: 64px; }
    #tiles button { min-width: 58px; height: 58px; border: 1px solid var(--line); border-radius: 15px; background: #f6efe4; color: var(--ink); cursor: pointer; font-size: 27px; font-weight: 800; box-shadow: 0 7px 0 #ded0bd; }
    #tiles button:disabled { opacity: .28; box-shadow: none; transform: translateY(6px); }
    .actions { display: flex; justify-content: center; gap: 9px; margin-top: 50px; }
    .actions button { min-height: 43px; padding: 0 20px; border: 1px solid var(--line); border-radius: 12px; background: transparent; cursor: pointer; font-weight: 800; }
    .actions button:last-child { border-color: var(--rust); background: var(--rust); color: white; }
    #message { min-height: 24px; margin-top: 20px; color: var(--rust); font-weight: 800; }
  </style>
</head>
<body>
  <header><b>LEXA LAB</b><a href="index.html#/today">回到學習首頁</a></header>
  <main>
    <section>
      <p class="eyebrow">實驗功能 · CORE 100</p>
      <h1>拼出越南語</h1>
      <p id="meaning">正在準備題目…</p>
      <div id="answer" aria-live="polite"></div>
      <div id="tiles" aria-label="拼字選項"></div>
      <div class="actions"><button id="reset" type="button">重新排列</button><button id="next" type="button">換一題</button></div>
      <p id="message" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="gravity.js?v=4"></script>
</body>
</html>
